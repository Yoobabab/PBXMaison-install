<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console du serveur · Callikoe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/c/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23f26b4f'/%3E%3Cstop offset='.5' stop-color='%23d8141c'/%3E%3Cstop offset='1' stop-color='%23e0006e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='8' cy='8' r='6' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
.pbx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pbx-card{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;color:inherit;transition:border-color .12s,box-shadow .12s}
.pbx-card:hover{border-color:var(--accent);box-shadow:0 4px 18px rgba(0,0,0,.06)}
.pbx-card strong{font-size:15px}
.pbx-card .mono{font-size:12px;color:var(--muted);word-break:break-all}
.pbx-card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.joblog{background:#111;color:#e8e8e8;border-radius:10px;padding:12px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:340px;overflow:auto;white-space:pre-wrap}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer}
.drop.on{border-color:var(--accent)}
.pbx-card.off{opacity:.65}
.pbx-stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.pbx-stats span{display:inline-flex;align-items:center;gap:5px}
.pbx-stats .warn{color:var(--warn);font-weight:600}
.pbx-card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.addr{display:flex;gap:8px}.addr input{flex:1 1 auto;min-width:120px;width:auto}.addr select{flex:0 0 auto;width:auto;max-width:55%}
fieldset{border:0;padding:0;margin:0;display:grid;gap:14px;align-content:start}
legend{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;padding:0}
.ok-text{color:var(--ok);font-size:13px}
.pbxt td{vertical-align:middle}
.pbxt .pn{display:flex;flex-direction:column;gap:2px;min-width:200px}
.pbxt .pn .mono{font-size:12px;color:var(--muted)}
.pbxt td .s{font-size:12px;color:var(--muted)}
.pbxt td[data-l="Licence"] .s{display:block}
.pbxt tr.off td{opacity:.6}
.pbxt tr.off td.pa{opacity:1}
.pbxt .warnc{color:var(--warn);font-weight:600}
.pbxt .pa{text-align:right;white-space:nowrap}
.sorth{background:none;border:0;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}
.sorth.on{color:var(--text)}
.more{position:relative;display:inline-block;margin-left:4px}
.more-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;display:flex;flex-direction:column;text-align:left}
.more-menu[hidden]{display:none}
.more-menu.up{top:auto;bottom:calc(100% + 4px)}
#cards .table-wrap{overflow:visible}
.more-menu a,.more-menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;background:none;border:0;font:inherit;font-size:14px;color:var(--text);text-decoration:none;cursor:pointer}
.more-menu a:hover,.more-menu button:hover{background:var(--bg)}
.more-menu .danger{color:var(--bad)}
.more-menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
@media (max-width:760px){
  .pbxt thead{display:none}
  .pbxt,.pbxt tbody,.pbxt tr,.pbxt td{display:block;width:100%}
  .pbxt tr{border-top:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
  .pbxt td{border:0;padding:0}
  .pbxt .pn{grid-column:1/-1}
  .pbxt td[data-l]::before{content:attr(data-l);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .pbxt .pa{grid-column:1/-1;text-align:left;margin-top:4px}
  .more-menu{left:0;right:auto}
}
.sipev-row{padding:10px 18px;border-top:1px solid var(--line);display:grid;gap:4px}
.sipev-row:first-child{border-top:0}
.sipev-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px}
.sipev-meta a{color:inherit}
.sipev-meta .grow{flex:1}
.wfil{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.wfil .dl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:80px}
.wfil.dim{opacity:.5}
.wchk{margin:0}
.ng-set{margin-top:4px;border:0!important;padding:0!important;background:none!important;box-shadow:none!important}
.ng-set>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--side-ink);font-size:14px;font-weight:500}
.ng-set>summary svg{flex:none;opacity:.85}
.ng-set>summary::-webkit-details-marker{display:none}
.ng-set>summary::after{content:"▸";margin-left:auto;transition:transform .15s;opacity:.7}
.ng-set[open]>summary::after{transform:rotate(90deg)}
.ng-set>summary:hover{background:var(--side-hover);color:#fff}
.ng-set>.ng{padding-left:8px;margin-top:2px}
.geo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px}
.geo-c{margin:0}
.geo-c[hidden]{display:none}
.th-sw{display:flex;flex-wrap:wrap;gap:10px}
.th-c{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;padding:10px 6px;border:2px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.th-c span{display:block;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative;overflow:hidden}
.th-c small{font-size:12px;text-align:center;line-height:1.2}
.th-c.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.th-c:disabled{cursor:default}
.th-custom span{background:conic-gradient(#e11d48,#f59e0b,#16a34a,#0ea5e9,#6d28d9,#e11d48)!important}
.th-custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.th-demo{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:14px;border:1px dashed var(--line);border-radius:12px}
.th-mark{width:34px;height:34px;border-radius:10px;background:var(--grad);position:relative}.th-mark::after{content:"";position:absolute;inset:10px;border-radius:50%;border:3px solid #fff}
.th-grad{background:var(--grad);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
.th-prev{min-height:120px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;background:repeating-conic-gradient(var(--bg) 0 25%,var(--panel) 0 50%) 0 0/16px 16px;overflow:hidden}
.th-prev img{max-width:100%;max-height:160px;display:block}
.th-bg img{max-height:200px;width:100%;object-fit:cover}
.th-wall img{width:480px;max-width:100%;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.kpi-link{display:block;text-decoration:none;color:inherit}.kpi-link>.kpi{height:100%}.kpi-link:hover>.kpi{border-color:var(--accent)}
.seg label.dim{opacity:.5;cursor:not-allowed}
.lict td .s{display:block}
.lict td.lk .mono{font-size:13px;color:var(--text);white-space:nowrap}
.kpis5{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
@media (max-width:760px){.lict td.lk{grid-column:1/-1}}
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body class="console no-side">
<aside class="side" id="side" aria-label="Menu principal">
  <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span><span class="bt"><strong id="srv-name">Serveur Callikoe</strong><small>Console du serveur</small></span></a>
  <nav id="nav"></nav>
  <div class="side-foot" id="user"></div>
</aside>
<div class="side-scrim" id="sidescrim"></div>
<div class="shell">
  <header class="topbar"><button type="button" class="burger" id="burger" aria-label="Ouvrir le menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="crumb" id="crumb"></div><div class="top-actions" id="topact"></div></header>
  <main id="app"><div class="empty"><span class="spin"></span></div></main>
  <footer>Callikoe · serveur multi-tenant</footer>
</div>
<script type="module" src="/hub.js"></script>
</body>
</html>
