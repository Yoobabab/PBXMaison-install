<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23f26b4f'/%3E%3Cstop offset='.5' stop-color='%23d8141c'/%3E%3Cstop offset='1' stop-color='%23e0006e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='8' cy='8' r='6' fill='url(%23g)'/%3E%3C/svg%3E">

<body class="sp">
<div id="root"><div class="sp-loading"><span class="spin"></span></div></div>
<audio id="remote" autoplay></audio>
<audio id="ringer" autoplay></audio>
<audio id="tones" autoplay></audio>
<script>
// Si le softphone ne démarre pas (navigateur trop ancien, fichier manquant…), on l'affiche au lieu de tourner sans fin
window.__spErr = function (msg) { var r = document.getElementById("root"); if (r && r.querySelector(".sp-loading")) r.innerHTML = '<div class="sp-loading" style="flex-direction:column;gap:12px;padding:24px;text-align:center"><strong>Le softphone n\'a pas pu démarrer</strong><span class="s">' + String(msg).replace(/[<>&]/g, "") + '</span><button class="btn" onclick="location.reload()">Recharger</button></div>'; };
window.addEventListener("error", function (e) { window.__spErr((e.message || "erreur") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "")); });
window.addEventListener("unhandledrejection", function (e) { window.__spErr(e.reason && e.reason.message || e.reason); });
setTimeout(function () { window.__spErr("Délai dépassé : vérifie la connexion au PBX."); }, 20000);
</script>
<script src="/vendor/jssip-3.10.1.min.js"></script>
<script type="module" src="/softphone.js" onerror="window.__spErr('Fichier softphone.js introuvable')"></script>
</body>
</html>
