#!KAMAILIO
# Callikoe — aiguilleur SIP du serveur multi-tenant (écrit par callikoe-host, ne pas modifier à la main)
#
#   Internet ── 5060 (UDP/TCP) ── ici ──┬── poste : domaine du client (To / R-URI)        → PBX du client 127.0.0.1:6000+N
#                                       └── trunk : compte du trunk (R-URI) ou SDA appelée → PBX du client
#   Les PBX clients passent par ici pour joindre les opérateurs (proxy sortant 127.0.0.2:5060).
#   Le son (RTP) ne passe pas par ici : il va directement au PBX du client.

debug=1
log_stderror=no
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "
fork=yes
children=4
tcp_children=4
mhomed=1
server_header="Server: Callikoe"
user_agent_header="User-Agent: Callikoe"
@@LISTEN@@
listen=udp:127.0.0.2:5060
listen=tcp:127.0.0.2:5060

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "db_text.so"
loadmodule "htable.so"
loadmodule "path.so"
loadmodule "nathelper.so"
loadmodule "pike.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "ctl.so"

modparam("ctl", "binrpc", "unix:/run/kamailio/kamailio_ctl")
modparam("rr", "enable_full_lr", 1)
modparam("rr", "enable_double_rr", 1)
modparam("path", "use_received", 1)
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
# Tables d'aiguillage (fichiers dans /var/lib/callikoe/kamailio/db, rechargées sans coupure par callikoe-host)
# db_text sans cache : sinon un rechargement relit l'ancienne version des tables (nouveaux PBX ignorés)
modparam("db_text", "db_mode", 1)
modparam("htable", "db_url", "text:///var/lib/callikoe/kamailio/db")
modparam("htable", "htable", "dom=>size=10;dbtable=dom;")
modparam("htable", "htable", "tru=>size=12;dbtable=tru;")
modparam("htable", "htable", "prx=>size=10;dbtable=prx;")
# Adresses IP des opérateurs : « IP|PBX » → jeton du trunk (appel vers une SDA sans le jeton du trunk)
modparam("htable", "htable", "ops=>size=10;dbtable=ops;")
# Anti-flood : au-delà de 400 requêtes en 2 s, l'adresse est ignorée 1 min (et notée pour fail2ban).
# Seuil large : un bureau entier derrière une même box qui redémarre (enregistrements + voyants BLF de chaque poste) ne doit pas être pris pour une attaque.
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 400)
modparam("pike", "remove_latency", 4)
modparam("htable", "htable", "ban=>size=8;autoexpire=60;")

request_route {
  if (!mf_process_maxfwd_header("10")) { sl_send_reply("483", "Too Many Hops"); exit; }
  if (!sanity_check("17895", "7")) { exit; }
  if ($si != "127.0.0.1") {
    if ($sht(ban=>$si) != $null) { exit; }
    if (!pike_check_req()) {
      xlog("L_WARN", "CALLIKOE-FLOOD $si\n");
      $sht(ban=>$si) = 1;
      exit;
    }
    # Rien de ce qui vient d'Internet ne peut se faire passer pour l'aiguilleur
    remove_hf_re("^X-CX-");
    force_rport();
  }
  if (is_method("CANCEL")) { if (t_check_trans()) { route(RELAY); } exit; }
  if (has_totag()) {
    # Suite d'un appel vers un PBX client : son Contact porte l'adresse publique de l'aiguilleur + son adresse interne (alias).
    # On remet l'adresse interne dans la R-URI avant loose_route (sinon elle serait prise pour l'aiguilleur lui-même).
    if ($si != "127.0.0.1" && $(ru{uri.param,alias}) =~ "^127\.0\.0\.1~6[0-9][0-9][0-9]~[0-9]$") {
      handle_ruri_alias();
      $rd = "127.0.0.1";
      $rp = $(du{uri.port});
    }
    if (loose_route()) {
      if ($si != "127.0.0.1" && nat_uac_test("19")) { add_contact_alias(); }
      if ($si == "127.0.0.1") {
        if (is_method("INVITE|UPDATE|SUBSCRIBE|NOTIFY|REFER")) { add_contact_alias(); }
        handle_ruri_alias();
      }
      route(RELAY); exit;
    }
    if (is_method("ACK")) { if (t_check_trans()) { route(RELAY); } exit; }
    sl_send_reply("404", "Not here"); exit;
  }
  t_check_trans();
  if ($si == "127.0.0.1") { route(FROM_PBX); }
  route(FROM_INTERNET);
}

# Requête initiale d'un PBX client : vers un poste (Route = Path enregistré) ou vers l'opérateur
route[FROM_PBX] {
  # Contact du PBX client : adresse publique annoncée + son adresse interne (alias), pour que la suite de l'appel lui revienne
  if (is_method("INVITE|SUBSCRIBE|REFER")) { add_contact_alias(); }
  if (loose_route()) { handle_ruri_alias(); t_on_reply("FROMOUT"); route(RELAY); exit; }
  record_route();
  t_on_reply("FROMOUT");
  # Proxy ou transport propre à l'opérateur (Unyc, Sewan en TCP…)
  if ($sht(prx=>$rd) != $null) { $du = $sht(prx=>$rd); }
  route(RELAY); exit;
}

route[FROM_INTERNET] {
  if (is_method("REGISTER")) {
    if ($sht(dom=>$td) == $null) { xlog("L_NOTICE", "CALLIKOE-UNKNOWN $si REGISTER $td\n"); sl_send_reply("404", "Unknown domain"); exit; }
    # Le PBX du client exige que le poste annonce Path : l'aiguilleur s'en porte garant
    if (!search("^(Supported|k):.*path")) { append_hf("Supported: path\r\n"); }
    add_path_received();
    $du = $sht(dom=>$td);
    t_on_reply("AUTHCHECK");
    route(RELAY); exit;
  }
  # Route préchargée par le poste (proxy sortant) : ignorée, c'est l'aiguilleur qui décide
  remove_hf("Route");
  if ($rU =~ "^cx[0-9a-f]{16}$" && $sht(tru=>$rU) != $null) {
    # Appel de l'opérateur sur le Contact du trunk (jeton secret) : le PBX reconnaît son trunk par cet en-tête
    $du = $sht(tru=>$rU);
    append_hf("X-CX-Trunk: $rU\r\n");
  } else if ($sht(dom=>$rd) != $null) {
    # Poste qui appelle (adresse de son PBX)
    $du = $sht(dom=>$rd);
  } else if ($sht(tru=>$rU) != $null || $sht(tru=>$tU) != $null) {
    # Appel vers une SDA : accepté seulement depuis une adresse de l'opérateur de ce client
    if ($sht(tru=>$rU) != $null) { $var(be) = $sht(tru=>$rU); } else { $var(be) = $sht(tru=>$tU); }
    $var(k) = $si + "|" + $var(be);
    if ($sht(ops=>$var(k)) == $null) {
      xlog("L_NOTICE", "CALLIKOE-UNKNOWN $si $rm $ru (SDA hors opérateur)\n");
      sl_send_reply("403", "Forbidden"); exit;
    }
    $du = $var(be);
    append_hf("X-CX-Trunk: $sht(ops=>$var(k))\r\n");
  } else if ($sht(dom=>$fd) != $null) {
    $du = $sht(dom=>$fd);
  } else { xlog("L_NOTICE", "CALLIKOE-UNKNOWN $si $rm $ru\n"); sl_send_reply("404", "Not found"); exit; }
  if (nat_uac_test("19")) { add_contact_alias(); }
  record_route();
  t_on_reply("AUTHCHECK");
  route(RELAY); exit;
}

route[RELAY] {
  # Vers un PBX client (127.0.0.1:600N) : partir de l'adresse interne de l'aiguilleur. Sans ça, sur certains serveurs
  # (OVH…), le système choisit 127.0.0.1 comme adresse de départ, où l'aiguilleur n'écoute pas : « no corresponding socket ».
  if ($du =~ "^sip:127\.0\.0\.1[:;>]" || ($du == $null && $rd == "127.0.0.1")) { force_send_socket(udp:127.0.0.2:5060); }
  if (!t_relay()) { sl_reply_error(); }
  exit;
}

# Échec d'authentification renvoyé par un PBX client : noté avec l'adresse réelle (fail2ban)
onreply_route[AUTHCHECK] {
  # Réponse d'un PBX client (200 OK…) : son adresse interne est gardée dans le Contact
  if ($si == "127.0.0.1" && $hdr(Contact) != $null) { add_contact_alias(); }
  if ($rs == 403 || ($rs == 401 && $T_req($hdr(Authorization)) != $null)) {
    xlog("L_WARN", "CALLIKOE-AUTHFAIL $T_req($si) $T_req($rm) $T_req($fu)\n");
  }
}
# Réponse d'un poste derrière une box : son adresse réelle est gardée dans le Contact (alias)
onreply_route[FROMOUT] {
  if (nat_uac_test("1")) { add_contact_alias(); }
}
