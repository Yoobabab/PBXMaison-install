; Callikoe — réglages des codecs
; Opus (softphone web et appli mobile, sur Internet et en 4G/5G) : correction d'erreurs (FEC) pour
; reconstituer les paquets perdus, débit adapté à la voix. Lu seulement si le module codec_opus est présent.
[opus]
type = opus
fec = yes
packet_loss = 10
signal = voice
dtx = no
max_bandwidth = wide
max_playback_rate = 16000
bitrate = 32000
