; Callikoe — plan de numérotation
; Partie fixe ; les parties réglées dans la console web sont dans /var/lib/pbxmaison :
;   extensions_routes.conf (variables de routes) et extensions_users.conf (utilisateurs, renvois, SDA).

[general]
static = yes
writeprotect = yes
clearglobalvars = yes

[globals]
; Licence : appels simultanés sur les trunks (entrants + sortants)
MAX_CALLS = @@MAX_CALLS@@
COUNTRY_CODE = @@COUNTRY_CODE@@
; Valeurs par défaut, remplacées par extensions_routes.conf
INBOUND_TARGET =
OUTBOUND_TRUNK =
OUTBOUND_CID =
OUTBOUND_FORMAT = national
OUTBOUND_CID_FORMAT = national
SEC_BLOCK_PREMIUM = 1
SEC_BLOCK_ANON = 0
SEC_MAX_USER_CALLS = 0
SEC_MAX_DURATION = 0
SEC_MAX_PER_HOUR = 100
SEC_MAX_INTL_DAY = 20
REC_ENABLED = 0
REC_DIRS = in,out
REC_ANNOUNCE =
; Routes réglées dans la console web (fichier écrit par la console)
#tryinclude @@CX_VAR@@/extensions_routes.conf

; ---------------------------------------------------------------------------
; Limite de licence : appelé au début de chaque appel externe
[pbx-limit]
exten => s,1,Set(GROUP(pbx)=trunkcalls)
 same => n,GotoIf($[${GROUP_COUNT(trunkcalls@pbx)} > ${MAX_CALLS}]?full)
 same => n,Return()
 same => n(full),Log(WARNING,Limite de licence atteinte : ${MAX_CALLS} appels simultanés)
 same => n,Congestion(5)
 same => n,Hangup(34)

; ---------------------------------------------------------------------------
; Appels passés par les postes
[from-internal]
; Urgences : toujours autorisées, jamais bloquées par la limite de licence.
; (Numéros exacts : prioritaires sur le motif _XXX des postes.)
exten => 15,1,Goto(emergency,${EXTEN},1)
exten => 17,1,Goto(emergency,${EXTEN},1)
exten => 18,1,Goto(emergency,${EXTEN},1)
exten => 112,1,Goto(emergency,${EXTEN},1)
exten => 114,1,Goto(emergency,${EXTEN},1)
exten => 115,1,Goto(emergency,${EXTEN},1)
exten => 119,1,Goto(emergency,${EXTEN},1)
exten => 116000,1,Goto(emergency,${EXTEN},1)
exten => 191,1,Goto(emergency,${EXTEN},1)
exten => 196,1,Goto(emergency,${EXTEN},1)
exten => 197,1,Goto(emergency,${EXTEN},1)

; Utilisateurs (3 chiffres) : sonnerie et renvois définis dans la console (contexte [users])
exten => _XXX,1,NoOp(Appel interne ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(__RINGTYPE=interne)
 same => n,GotoIf(${DIALPLAN_EXISTS(users,${EXTEN},1)}?users,${EXTEN},1)
 ; Groupes d'appel, files d'attente, SVI, messageries de groupe (console : Gestion d'appels)
 same => n,GotoIf(${DIALPLAN_EXISTS(callflow,${EXTEN},1)}?callflow,${EXTEN},1)
 same => n,Playback(pbx-invalid)
 same => n,Hangup()

; Supervision des postes (touches BLF)
include => users-hints
include => callflow-hints
; Codes raccourcis : parcage, interception (**201), statut, files, messagerie (*97, *98)… (console : Codes raccourcis)
include => shortcodes

; Numéros nationaux (France : 0 + 9 chiffres)
exten => _0[1-9]XXXXXXXX,1,Goto(outbound,${EXTEN},1)

; Numéros surtaxés 089x et renseignements 118xxx : bloqués par défaut (console : Sécurité)
exten => _089XXXXXXX,1,GotoIf($["${SEC_BLOCK_PREMIUM}" = "0"]?outbound,${EXTEN},1)
 same => n,Log(NOTICE,Numéro surtaxé bloqué : ${EXTEN} depuis ${CALLERID(num)})
 same => n,Playback(ss-noservice)
 same => n,Hangup()
exten => _118XXX,1,GotoIf($["${SEC_BLOCK_PREMIUM}" = "0"]?outbound,${EXTEN},1)
 same => n,Log(NOTICE,Numéro surtaxé bloqué : ${EXTEN} depuis ${CALLERID(num)})
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; Numéros courts de services (3xxx)
exten => _3XXX,1,Goto(outbound,${EXTEN},1)

; International : bloqué sauf pays autorisés (console : Sécurité), protection contre la fraude
exten => _00.,1,GotoIf(${DIALPLAN_EXISTS(intl-allowed,${EXTEN},1)}?outbound,${EXTEN},1)
 same => n,Log(NOTICE,International bloqué : ${EXTEN} depuis ${CALLERID(num)})
 same => n,Playback(ss-noservice)
 same => n,Hangup()

exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Sortie vers le trunk
; USER_OPTS est posé par l'endpoint du poste (set_var) : <numéro présenté>,<appels externes bloqués 0|1>
[outbound]
exten => _X.,1,Set(CDR(direction)=out)
 same => n,GotoIf($["${CUT(USER_OPTS,\,,2)}" = "1"]?blocked)
 ; Numéros bloqués en sortie (console : Sécurité)
 same => n,GotoIf(${DIALPLAN_EXISTS(blocked-out,${EXTEN},1)}?blockednum)
 ; Garde-fou anti-fraude : plafonds par heure et international par jour (console : Sécurité)
 same => n,Gosub(fraud-guard,s,1(${EXTEN}))
 same => n,GotoIf($["${GOSUB_RETVAL}" = "over"]?fraud)
 same => n,Gosub(pbx-limit,s,1)
 ; Appels externes simultanés par utilisateur et durée maximale (console : Sécurité)
 same => n,Set(SRC=${CUT(CUT(CHANNEL(name),/,2),-,1)})
 same => n,ExecIf($[0${SEC_MAX_USER_CALLS} > 0]?Set(GROUP(peruser)=${SRC}))
 same => n,GotoIf($[0${SEC_MAX_USER_CALLS} > 0 & ${GROUP_COUNT(${SRC}@peruser)} > 0${SEC_MAX_USER_CALLS}]?toomany)
 same => n,ExecIf($[0${SEC_MAX_DURATION} > 0]?Set(TIMEOUT(absolute)=$[${SEC_MAX_DURATION} * 60]))
 ; Enregistrement de l'appel (console : Enregistrements)
 same => n,Gosub(rec-start,s,1(out))
 ; Règles sortantes (console : Règles sortantes), sinon trunk par défaut
 same => n,GotoIf(${DIALPLAN_EXISTS(out-rules,${EXTEN},1)}?out-rules,${EXTEN},1)
 same => n,GotoIf($["${OUTBOUND_TRUNK}" = ""]?notrunk)
 ; Format du numéro composé attendu par l'opérateur (seuls les numéros en 0… sont convertis)
 same => n,Gosub(fmt-num,s,1(${EXTEN},${OUTBOUND_FORMAT}))
 same => n,Set(NUM=${GOSUB_RETVAL})
 same => n,ExecIf($["${OUTBOUND_CID}" != ""]?Set(CALLERID(num)=${OUTBOUND_CID}))
 ; Numéro présenté propre à l'utilisateur
 same => n,Set(UCID=${CUT(USER_OPTS,\,,1)})
 same => n,GotoIf($["${UCID}" = ""]?dial)
 same => n,Gosub(fmt-num,s,1(${UCID},${OUTBOUND_CID_FORMAT}))
 same => n,Set(CALLERID(num)=${GOSUB_RETVAL})
 same => n(dial),Dial(PJSIP/${NUM}@${OUTBOUND_TRUNK},120,T)
 same => n,Hangup()
 same => n(blocked),Log(NOTICE,Appels externes interdits pour ${CHANNEL(endpoint)} (console : utilisateur > Options))
 same => n,Playback(ss-noservice)
 same => n,Hangup()
 same => n(notrunk),Log(WARNING,Aucun trunk sortant configuré (console : Routes))
 same => n,Playback(ss-noservice)
 same => n,Hangup()
 same => n(blockednum),Log(NOTICE,Numéro bloqué en sortie : ${EXTEN} depuis ${CALLERID(num)} (console : Sécurité))
 same => n,Playback(ss-noservice)
 same => n,Hangup()
 same => n(fraud),Playback(ss-noservice)
 same => n,Hangup()
 same => n(toomany),Log(NOTICE,Trop d'appels externes simultanés pour ${SRC} (console : Sécurité))
 same => n,Congestion(5)
 same => n,Hangup()

; Numéro présenté d'une règle sortante : ARG1 mode (user|trunk|custom|hidden), ARG2 numéro choisi, ARG3 numéro du trunk, ARG4 format
[out-cid]
exten => s,1,Set(LOCAL(C)=${ARG3})
 same => n,ExecIf($["${ARG1}" = "custom" & "${ARG2}" != ""]?Set(LOCAL(C)=${ARG2}))
 same => n,ExecIf($["${ARG1}" = "user" & "${CUT(USER_OPTS,\,,1)}" != ""]?Set(LOCAL(C)=${CUT(USER_OPTS,\,,1)}))
 same => n,GotoIf($["${C}" = ""]?pres)
 same => n,Gosub(fmt-num,s,1(${C},${ARG4}))
 same => n,Set(CALLERID(num)=${GOSUB_RETVAL})
 same => n(pres),ExecIf($["${ARG1}" = "hidden"]?Set(CALLERID(pres)=prohib))
 same => n,Return()

; Enregistrement d'un appel externe : ARG1 = in | out (console : Enregistrements)
;   REC_ENABLED 0|1, REC_DIRS « in,out », REC_ANNOUNCE = annonce jouée à l'appelant (entrant) ou vide
;   Fichier : /var/spool/asterisk/monitor/callikoe/AAAA/MM/JJ/<horodatage>-<sens>-<id>.wav, nom dans CDR(userfield)
[rec-start]
exten => s,1,GotoIf($["${REC_ENABLED}" != "1" | "${REC_FILE}" != ""]?done)
 same => n,GotoIf($["${REC_DIRS}" != "" & ${REGEX("(^|,)${ARG1}(,|$)" ${REC_DIRS})} = 0]?done)
 same => n,Set(__REC_FILE=${STRFTIME(${EPOCH},,%Y/%m/%d/%H%M%S)}-${ARG1}-${UNIQUEID}.wav)
 same => n,Set(CDR(userfield)=${REC_FILE})
 same => n,GotoIf($["${ARG1}" != "in" | "${REC_ANNOUNCE}" = ""]?mix)
 same => n,Answer()
 same => n,Playback(${REC_ANNOUNCE})
 same => n(mix),MixMonitor(@@AST_SPOOL@@/monitor/callikoe/${REC_FILE},b)
 same => n(done),Return()

; Renvoi d'un utilisateur vers un numéro externe (ou son mobile en sonnerie simultanée)
; Seuls les numéros nationaux (0 + 9 chiffres) sont acceptés : jamais l'international ni un numéro court
[user-external]
exten => _0[1-9]XXXXXXXX,1,NoOp(Renvoi externe vers ${EXTEN})
 same => n,GotoIf(${DIALPLAN_EXISTS(blocked-out,${EXTEN},1)}?blocked)
 same => n,GotoIf($["${EXTEN:0:3}" = "089" | "${EXTEN:0:3}" = "118"]?blocked)
 same => n,Gosub(fraud-guard,s,1(${EXTEN}))
 same => n,GotoIf($["${GOSUB_RETVAL}" = "over"]?blocked)
 same => n,Gosub(pbx-limit,s,1)
 same => n,GotoIf(${DIALPLAN_EXISTS(out-rules,${EXTEN},1)}?out-rules,${EXTEN},1)
 same => n,GotoIf($["${OUTBOUND_TRUNK}" = ""]?notrunk)
 same => n,Gosub(fmt-num,s,1(${EXTEN},${OUTBOUND_FORMAT}))
 same => n,Set(NUM=${GOSUB_RETVAL})
 same => n,ExecIf($["${OUTBOUND_CID}" != ""]?Set(CALLERID(num)=${OUTBOUND_CID}))
 same => n,Dial(PJSIP/${NUM}@${OUTBOUND_TRUNK},60)
 same => n,Hangup()
 same => n(notrunk),Log(WARNING,Renvoi externe impossible : aucun trunk sortant (console : Routes))
 same => n,Hangup()
 same => n(blocked),Log(NOTICE,Renvoi vers un numéro bloqué : ${EXTEN} (console : Sécurité))
 same => n,Hangup()

exten => _X.,1,Log(WARNING,Renvoi externe refusé vers ${EXTEN} : seuls les numéros nationaux sont autorisés)
 same => n,Hangup()

; Garde-fou anti-fraude (ARG1 = numéro composé) → GOSUB_RETVAL ok | over
;   SEC_MAX_PER_HOUR : appels externes par heure pour tout le PBX ; SEC_MAX_INTL_DAY : appels internationaux par jour
;   Compteurs dans la base Asterisk (callikoe_rate), dernier blocage dans callikoe_fraud/last (lu par la console : Alertes)
[fraud-guard]
exten => s,1,Set(LOCAL(H)=${STRFTIME(${EPOCH},,%Y%m%d%H)})
 same => n,Set(LOCAL(C)=$[0${DB(callikoe_rate/h${H})} + 1])
 same => n,Set(DB(callikoe_rate/h${H})=${C})
 same => n,GotoIf($[0${SEC_MAX_PER_HOUR} > 0 & ${C} > 0${SEC_MAX_PER_HOUR}]?over)
 same => n,GotoIf($["${ARG1:0:2}" != "00"]?ok)
 same => n,Set(LOCAL(J)=${STRFTIME(${EPOCH},,%Y%m%d)})
 same => n,Set(LOCAL(I)=$[0${DB(callikoe_rate/i${J})} + 1])
 same => n,Set(DB(callikoe_rate/i${J})=${I})
 same => n,GotoIf($[0${SEC_MAX_INTL_DAY} > 0 & ${I} > 0${SEC_MAX_INTL_DAY}]?over)
 same => n(ok),Return(ok)
 same => n(over),Set(DB(callikoe_fraud/last)=${EPOCH}|${ARG1}|${CALLERID(num)})
 same => n,Log(WARNING,Plafond anti-fraude atteint : appel vers ${ARG1} depuis ${CALLERID(num)} refusé (console : Sécurité))
 same => n,Return(over)

; Marque chaque poste qui sonne (Dial b()) pour l'interception **<poste>
; et indique au téléphone le type d'appel (sonnerie choisie : interne, externe, groupe, file, svi)
; Appel entrant : nom affiché selon le réglage CID_DISPLAY ; CXNAME = nom trouvé dans l'annuaire (phonebook)
; Le journal des appels retire le numéro ajouté au nom (console/lib/cdr.mjs)
[cid-display]
exten => s,1,Set(LOCAL(NUM)=${CALLERID(num)})
 same => n,GotoIf($["${NUM}" = "" | "${CID_DISPLAY}" = "" | "${CID_DISPLAY}" = "name"]?done)
 same => n,ExecIf($["${CID_DISPLAY}" = "number"]?Set(CALLERID(name)=${NUM}))
 same => n,ExecIf($["${CID_DISPLAY}" = "name_number" & "${CXNAME}" != ""]?Set(CALLERID(name)=${CXNAME} - ${NUM}))
 same => n,ExecIf($["${CID_DISPLAY}" = "number_name" & "${CXNAME}" != ""]?Set(CALLERID(name)=${NUM} - ${CXNAME}))
 same => n(done),Return()

[pickup-mark]
exten => s,1,Set(PICKUPMARK=${CUT(CUT(CHANNEL(name),/,2),-,1)})
 same => n,ExecIf($["${RINGTYPE}" != ""]?Set(PJSIP_HEADER(add,Alert-Info)=<http://127.0.0.1>\;info=callikoe-${RINGTYPE}))
 same => n,Return()

; Convertit un numéro national (ARG1) au format ARG2 : national, e164, e164_plus → GOSUB_RETVAL
[fmt-num]
exten => s,1,Set(LOCAL(N)=${ARG1})
 same => n,ExecIf($["${N:0:1}" = "0" & "${ARG2}" = "e164"]?Set(N=${COUNTRY_CODE}${N:1}))
 same => n,ExecIf($["${N:0:1}" = "0" & "${ARG2}" = "e164_plus"]?Set(N=+${COUNTRY_CODE}${N:1}))
 same => n,Return(${N})

; Urgences : sans limite de licence, numéro court tel quel
[emergency]
exten => _X.,1,Log(NOTICE,Appel d'urgence ${EXTEN} depuis ${CALLERID(num)})
 same => n,GotoIf($["${OUTBOUND_TRUNK}" = ""]?notrunk)
 same => n,ExecIf($["${OUTBOUND_CID}" != ""]?Set(CALLERID(num)=${OUTBOUND_CID}))
 same => n,Dial(PJSIP/${EXTEN}@${OUTBOUND_TRUNK},,T)
 same => n,Hangup()
 same => n(notrunk),Log(ERROR,Appel d'urgence impossible : aucun trunk sortant)
 same => n,Hangup()

; ---------------------------------------------------------------------------
;Appels reçus des trunks (contexte des endpoints trunk)
; TRUNK_OPTS est posé par l'endpoint du trunk (set_var) : <format appelant>,<source de la SDA>
;   format appelant : national | e164 | e164_plus | keep
;   source de la SDA : to (en-tête To) | request_uri
[from-trunk]
exten => _X.,1,Goto(trunk-in,s,1)
exten => _+X.,1,Goto(trunk-in,s,1)
exten => s,1,Goto(trunk-in,s,1)
; Serveur multi-tenant : l'opérateur appelle le Contact du trunk (jeton cx…) ; la SDA est alors lue dans l'en-tête To
exten => _[c][x].,1,Goto(trunk-in,s,1)

[trunk-in]
exten => s,1,Set(__DID=${CALLERID(dnid)})
 same => n,Set(CALLERFMT=${CUT(TRUNK_OPTS,\,,1)})
 same => n,Set(DIDFROM=${CUT(TRUNK_OPTS,\,,2)})
 same => n,GotoIf($["${DIDFROM}" != "to" & "${DID:0:2}" != "cx"]?caller)
 ; SDA lue dans l'en-tête To : "Nom" <sip:0412345678@operateur>
 same => n,Set(TOH=${PJSIP_HEADER(read,To)})
 same => n,Set(TOU=${CUT(TOH,@,1)})
 same => n,ExecIf($["${CUT(TOU,:,2)}" != ""]?Set(__DID=${CUT(TOU,:,2)}))
 same => n(caller),Gosub(normalize-caller,s,1(${CALLERFMT}))
 same => n,Goto(inbound,s,1)

; Met le numéro de l'appelant au format demandé (ARG1) : national, e164, e164_plus ou keep
[normalize-caller]
exten => s,1,Set(LOCAL(RAW)=${CALLERID(num)})
 same => n,Set(LOCAL(N)=${FILTER(0123456789,${RAW})})
 same => n,Set(LOCAL(CCL)=${LEN(${COUNTRY_CODE})})
 same => n,Set(LOCAL(E)=)
 same => n,GotoIf($["${ARG1}" = "" | "${ARG1}" = "keep" | "${N}" = ""]?done)
 same => n,ExecIf($["${RAW:0:1}" = "+"]?Set(LOCAL(E)=${N}))
 same => n,ExecIf($["${E}" = "" & "${N:0:2}" = "00"]?Set(LOCAL(E)=${N:2}))
 same => n,ExecIf($["${E}" = "" & "${N:0:1}" = "0"]?Set(LOCAL(E)=${COUNTRY_CODE}${N:1}))
 same => n,ExecIf($["${E}" = "" & "${N:0:${CCL}}" = "${COUNTRY_CODE}" & ${LEN(${N})} > 9]?Set(LOCAL(E)=${N}))
 same => n,GotoIf($["${E}" = ""]?done)
 same => n,ExecIf($["${ARG1}" = "e164"]?Set(CALLERID(num)=${E}))
 same => n,ExecIf($["${ARG1}" = "e164_plus"]?Set(CALLERID(num)=+${E}))
 same => n,ExecIf($["${ARG1}" = "national" & "${E:0:${CCL}}" = "${COUNTRY_CODE}"]?Set(CALLERID(num)=0${E:${CCL}}))
 same => n(done),Return()

; SDA au format national (0…) dans DIDN
[did-national]
exten => s,1,Set(LOCAL(N)=${FILTER(0123456789,${DID})})
 same => n,Set(LOCAL(CCL)=${LEN(${COUNTRY_CODE})})
 same => n,Set(DIDN=${N})
 same => n,ExecIf($["${N:0:2}" = "00"]?Set(N=${N:2}))
 same => n,ExecIf($["${N:0:1}" != "0" & "${N:0:${CCL}}" = "${COUNTRY_CODE}" & ${LEN(${N})} > 9]?Set(DIDN=0${N:${CCL}}))
 same => n,ExecIf($["${N:0:1}" != "0" & ${LEN(${N})} = 9]?Set(DIDN=0${N}))
 same => n,Return()

[inbound]
exten => s,1,NoOp(Appel entrant de ${CALLERID(num)} sur ${DID})
 same => n,Gosub(pbx-limit,s,1)
 ; SDA attribuée à un utilisateur (console : utilisateur > Général)
 same => n,Gosub(did-national,s,1)
 ; Journal des appels : SDA appelée et sens de l'appel
 same => n,Set(CDR(did)=${DIDN})
 same => n,Set(CDR(direction)=in)
 same => n,Set(__RINGTYPE=externe)
 ; Nom de l'appelant d'après l'annuaire de l'entreprise (console : Annuaire)
 same => n,Set(CNUM=${FILTER(0123456789,${CALLERID(num)})})
 same => n,ExecIf(${DIALPLAN_EXISTS(phonebook,${CNUM},1)}?Gosub(phonebook,${CNUM},1))
 ; Ce qu'affichent les téléphones (console : Annuaire › Affichage des appels entrants)
 same => n,Gosub(cid-display,s,1)
 ; Protection anti-fraude collective (console : Sécurité › Protection anti-fraude collective) : jamais pour un contact de l'annuaire
 same => n,GotoIf($["${SHIELD_MODE}" = "" | "${SHIELD_MODE}" = "off" | "${CXNAME}" != "" | "${CNUM}" = ""]?shok)
 same => n,GotoIf($[${DIALPLAN_EXISTS(shield,${CNUM},1)} = 0]?shok)
 same => n,GotoIf($["${SHIELD_MODE}" = "block"]?blockedin)
 same => n,Set(CALLERID(name)=ARNAQUE? ${IF($["${CALLERID(name)}" = ""]?${CALLERID(num)}:${CALLERID(name)})})
 same => n(shok),NoOp()
 ; Numéros bloqués et appels masqués (console : Sécurité)
 same => n,GotoIf(${DIALPLAN_EXISTS(blocked-in,${CNUM},1)}?blockedin)
 same => n,GotoIf($["${SEC_BLOCK_ANON}" = "1" & "${CNUM}" = ""]?blockedin)
 ; Enregistrement et annonce d'enregistrement (console : Enregistrements)
 same => n,Gosub(rec-start,s,1(in))
 same => n,GotoIf(${DIALPLAN_EXISTS(did-map,${DIDN},1)}?did-map,${DIDN},1)
 ; Standard fermé ou renvoyé (touche « Standard », *80 / *81 / *82, softphone, appli, console › Gestion d'appels › Standard)
 same => n,Set(STD=${DB(callikoe/standard)})
 same => n,GotoIf($["${STD}" = "" | "${STD}" = "open"]?stdok)
 same => n,GotoIf($[${DIALPLAN_EXISTS(standard-skip,${DIDN},1)} = 0 & ${DIALPLAN_EXISTS(standard-closed,s,1)}]?standard-closed,s,1)
 same => n(stdok),NoOp()
 ; Règles entrantes par SDA, puis règle par défaut (console : Gestion d'appels › Règles entrantes)
 same => n,GotoIf(${DIALPLAN_EXISTS(did-rules,${DIDN},1)}?did-rules,${DIDN},1)
 same => n,GotoIf(${DIALPLAN_EXISTS(did-rules,default,1)}?did-rules,default,1)
 ; Ancienne route « tous les postes cochés » (console : Routes)
 same => n,GotoIf($["${INBOUND_TARGET}" = ""]?none)
 same => n,Dial(${INBOUND_TARGET},45,tb(pickup-mark^s^1))
 same => n,Hangup()
 same => n(none),Log(WARNING,Aucune destination entrante configurée (console : Routes))
 same => n,Answer()
 same => n,Playback(ss-noservice)
 same => n,Hangup()
 same => n(blockedin),Log(NOTICE,Appel entrant bloqué de ${CALLERID(num)} (console : Sécurité))
 same => n,Hangup(21)

; ---------------------------------------------------------------------------
; Utilisateurs, renvois, SDA, messagerie : écrit par la console web
#tryinclude @@CX_VAR@@/extensions_users.conf
; Groupes, files, SVI, horaires, règles entrantes : écrit par la console web
#tryinclude @@CX_VAR@@/extensions_callflow.conf
