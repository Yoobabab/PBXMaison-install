; PBXMaison — généré par l'installeur
[directories](!)
astetcdir => @@AST_ETC@@
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => @@AST_VARLIB@@
astdbdir => @@AST_VARLIB@@
astkeydir => @@AST_VARLIB@@
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => @@AST_SPOOL@@
astrundir => @@AST_RUN@@
astlogdir => @@AST_LOG@@
astsbindir => /usr/sbin

[options]
defaultlanguage = @@LANGUAGE@@
documentation_language = en_US
; Pas de console distante pour d'autres utilisateurs que asterisk/root
astctlpermissions = 0660
astctlowner = @@AST_USER@@
astctlgroup = @@AST_GROUP@@
