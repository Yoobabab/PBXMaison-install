; PBXMaison — messagerie vocale
; Les boîtes sont créées dans la console web (utilisateur > Messagerie vocale).
[general]
format = wav
attach = no
maxmsg = 100
maxsecs = 180
minsecs = 2
maxgreet = 60
maxsilence = 0
silencethreshold = 128
maxlogins = 3
skipms = 3000
review = no
operator = no
envelope = yes
sayduration = no
nextaftercmd = yes
emaildateformat = %d/%m/%Y %H:%M

[zonemessages]
paris = Europe/Paris|'vm-received' Q 'digits/at' HM

[default]
#tryinclude @@CX_VAR@@/voicemail_users.conf
