; Callikoe — salles de réunion (console : Gestion d'appels › Réunions)
[general]

[callikoe_bridge]
type = bridge
video_mode = sfu
max_members = 20
mixing_interval = 20
internal_sample_rate = auto
record_conference = no

[callikoe_user]
type = user
music_on_hold_when_empty = yes
announce_user_count = yes
announce_only_user = yes
announce_join_leave = no
dsp_drop_silence = yes
jitterbuffer = yes
quiet = no

[callikoe_menu]
type = menu
* = playback_and_continue(conf-usermenu)
1 = toggle_mute
3 = decrease_listening_volume
4 = increase_listening_volume
