; PBXMaison — généré par l'installeur
; Les postes et les trunks sont en base (voir sorcery.conf). Ici : transports uniquement.

[global]
type = global
user_agent = PBXMaison
; Pas d'endpoint « anonymous » : un appel non identifié (ni trunk, ni poste) est rejeté
endpoint_identifier_order = ip,username
max_initial_qualify_time = 4

[system]
type = system
timer_t1 = 500
timer_b = 32000

; Port SIP : 5060 ou 5160 (console : Sécurité › Port SIP). Pendant une transition, l'autre port reste ouvert (transports « -legacy »).
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:@@SIP_PORT@@
; Répond aux postes par le port sur lequel ils se sont enregistrés (utile pendant un changement de port)
symmetric_transport = yes
external_media_address = @@PUBLIC_IP@@
external_signaling_address = @@PUBLIC_IP@@
@@LOCAL_NETS@@

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:@@SIP_PORT@@
; Répond aux postes par le port sur lequel ils se sont enregistrés (utile pendant un changement de port)
symmetric_transport = yes
external_media_address = @@PUBLIC_IP@@
external_signaling_address = @@PUBLIC_IP@@
@@LOCAL_NETS@@
@@SIP_LEGACY@@

; WebSocket pour le softphone web (WebRTC) : Nginx transmet https://<fqdn>/ws au serveur HTTP local d'Asterisk
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0
external_media_address = @@PUBLIC_IP@@
external_signaling_address = @@PUBLIC_IP@@

; Transport TLS (5061), créé quand le certificat est disponible
#tryinclude pjsip_tls.conf
